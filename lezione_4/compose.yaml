services:
  assistente:
    build: .
    env_file: .env
    environment:
      # LM Studio resta sull'host: dal container si raggiunge con host.docker.internal.
      LM_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
